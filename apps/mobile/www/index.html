<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WFM — Praxivo Labs</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #031751;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #FFFFFF;
      margin-bottom: 4px;
    }
    .brand-title {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #CBA135;
      margin-bottom: 24px;
    }
    .card {
      background-color: #072274;
      border: 1px solid #1B365D;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      width: 100%;
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.15rem;
      margin: 0 0 10px 0;
      color: #FFFFFF;
      font-weight: 600;
    }
    p {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #D1D5DB;
      margin: 0;
    }
    .footer {
      margin-top: 32px;
      font-size: 0.75rem;
      color: #9CA3AF;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">WFM</div>
    <div class="brand-title">Praxivo Labs</div>
    <div class="card">
      <h1>Server Connection Offline</h1>
      <p>WFM could not reach the server.<br>Please check your network or VPN connection and retry.</p>
    </div>
    <div class="footer">
      <div>Turning Ideas into Intelligence</div>
      <div>&copy; 2026 Praxivo Labs. All rights reserved.</div>
    </div>
  </div>
</body>
</html>
