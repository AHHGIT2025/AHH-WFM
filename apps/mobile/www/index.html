<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHH WFM Mobile</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      max-width: 400px;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 12px;
      color: #ef4444;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.5;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connection Error</h1>
    <p>AHH WFM Mobile could not connect to the application server.<br>Connect to the AHH network or VPN and try again.</p>
  </div>
</body>
</html>
